name: foreign-flow
on:
  schedule:
    - cron: "*/10 4,5 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Isi 1 untuk tes di luar jam jeda siang"
        default: "0"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node update.mjs
        env:
          FF_FORCE: ${{ github.event.inputs.force }}
      - name: Simpan jika berubah
        run: |
          git config user.name "ff-bot"
          git config user.email "ff-bot@users.noreply.github.com"
          git add foreign-flow.json
          git diff --cached --quiet || (git commit -m "foreign flow" && git push)
